<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study Timer</title>
  <link rel="stylesheet" href="timer.css">
</head>
<body>

<div class="timer-container">

  <h2>Study Timer ⏱</h2>

  <!-- 🔥 INPUT -->
  <div class="input-box">
    <input type="number" id="hours" placeholder="HH" min="0">
    <input type="number" id="minutes" placeholder="MM" min="0">
    <input type="number" id="seconds" placeholder="SS" min="0">
  </div>

  <!-- ⏱ DISPLAY -->
  <div id="time">00:00:00</div>

  <p id="mode">Focus Mode 🔥</p>

  <!-- BUTTONS -->
  <div class="buttons">
    <button onclick="startTimer()">Start</button>
    <button onclick="pauseTimer()">Pause</button>
    <button onclick="resetTimer()">Reset</button>
  </div>

</div>

<script src="timer.js"></script>
<audio id="alarmSound" src="alarm.mp3.wav"></audio>

</body>
</html>
